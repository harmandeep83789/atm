[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-simulator"
version = "1.0.0"
authors = [
  { name="Harmandeep Singh", email="harmandeep83789@gmail.com" },
]
description = "A modular and secure Python ATM Banking Simulation System"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
atm = "main:main"
